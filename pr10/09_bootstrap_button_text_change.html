<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Change Button</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1 id="title">Original Heading</h1>
  <button class="btn btn-secondary" onclick="document.getElementById('title').textContent='Heading updated with Bootstrap button click!'">Change Heading</button>
</body>
</html>
