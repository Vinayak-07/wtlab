<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Badge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h2>Notifications <span class="badge bg-danger">4</span></h2>
    <p><span class="badge bg-primary">Primary</span> <span class="badge rounded-pill bg-success">Pill Badge</span></p>
    <button class="btn btn-dark">Inbox <span class="badge bg-light text-dark">12</span></button>
  </div>
</body>
</html>
