<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap List Group</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5" style="max-width: 500px;">
    <ul class="list-group">
      <li class="list-group-item active">Practical Items</li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Task 1 <span class="badge text-bg-primary rounded-pill">Done</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Task 2 <span class="badge text-bg-warning rounded-pill">Pending</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Task 3 <span class="badge text-bg-success rounded-pill">Done</span></li>
    </ul>
  </div>
</body>
</html>
