<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap CDN Show Message Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <h2 class="mb-3">Bootstrap CDN Demo</h2>

  <script>
    function showMessage() {
      alert("Bootstrap is working successfully!");
    }
  </script>
</body>
</html>
