<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Bootstrap Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-3">Interactive Buttons</h2>
    <button class="btn btn-primary me-2" onclick="showMessage('Primary button clicked!')">Primary Action</button>
    <button class="btn btn-warning" onclick="showMessage('Warning button clicked!')">Warning Action</button>
    <div id="message" class="alert alert-info mt-4 d-none" role="alert"></div>
  </div>
  <script>
    function showMessage(text) {
      const box = document.getElementById('message');
      box.textContent = text;
      box.classList.remove('d-none');
    }
  </script>
</body>
</html>
