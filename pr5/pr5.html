<!DOCTYPE html>
<html>
<head>
<title>Table Tags</title>
<style>
body{font-family:Arial;margin:30px;}
h2{color:#2b4a8b;}
table{border-collapse:collapse;margin-bottom:30px;}
th,td{border:1px solid #333;padding:8px 14px;text-align:center;}
th{background-color:#2b4a8b;color:white;}
</style>
</head>
<body>

<h2>Basic Table</h2>
<table>
  <caption>Student Marks</caption>
  <tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Marks</th>
  </tr>
  <tr>
    <td>1</td>
    <td>Rahul</td>
    <td>85</td>
  </tr>
  <tr>
    <td>2</td>
    <td>Sneha</td>
    <td>90</td>
  </tr>
  <tr>
    <td>3</td>
    <td>Amit</td>
    <td>78</td>
  </tr>
</table>

<h2>Table with Rowspan and Colspan</h2>
<table>
  <tr>
    <th>Name</th>
    <th colspan="2">Marks</th>
  </tr>
  <tr>
    <td rowspan="2">Rahul</td>
    <td>Maths</td>
    <td>85</td>
  </tr>
  <tr>
    <td>Science</td>
    <td>92</td>
  </tr>
</table>

</body>
</html>
