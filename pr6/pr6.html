<!DOCTYPE html>
<html>
<head>
<title>Form Tags</title>
<style>
body{font-family:Arial;margin:30px;}
h2{color:#2b4a8b;}
label{display:inline-block;width:150px;}
fieldset{margin-bottom:20px;}
</style>
</head>
<body>

<h2>Student Registration Form</h2>

<form action="#" method="post">

  <fieldset>
  <legend>Personal Information</legend>

  <label for="name">Full Name:</label>
  <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="abc@example.com"><br><br>

  <label for="pass">Password:</label>
  <input type="password" id="pass" name="pass"><br><br>

  <label for="dob">Date of Birth:</label>
  <input type="date" id="dob" name="dob"><br><br>

  <label>Gender:</label>
  <input type="radio" id="male" name="gender" value="Male"><label for="male">Male</label>
  <input type="radio" id="female" name="gender" value="Female"><label for="female">Female</label><br><br>

  <label>Hobbies:</label>
  <input type="checkbox" id="reading" name="hobby"><label for="reading">Reading</label>
  <input type="checkbox" id="sports" name="hobby"><label for="sports">Sports</label><br><br>

  <label for="course">Course:</label>
  <select id="course" name="course">
    <option>BCA</option>
    <option>B.Sc</option>
    <option>B.Tech</option>
  </select><br><br>

  <label for="addr">Address:</label>
  <textarea id="addr" rows="3" cols="30"></textarea><br><br>

  </fieldset>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">

</form>

</body>
</html>
